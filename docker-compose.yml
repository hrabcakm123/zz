version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www
      - /var/www/vendor
    environment:
      - REDIS_HOST=redis  
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - redis

  redis:
    image: redis:alpine    